<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>VAULT PRO - TABLET INTERFACE</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="cache-buster" content="v2.0.1">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #000 70%);
            color: #00d4ff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }

        .stars {
            position: fixed;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 40px 70px, #fff, transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(1px 1px at 130px 80px, #fff, transparent),
                radial-gradient(2px 2px at 160px 30px, #fff, transparent);
            background-repeat: repeat;
            background-size: 400px 400px;
            animation: twinkle 4s ease-in-out infinite alternate;
            z-index: -1;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .login-container {
            background: linear-gradient(145deg, rgba(26, 26, 46, 0.95), rgba(22, 33, 62, 0.95));
            border: 2px solid #00d4ff;
            border-radius: 8px;
            padding: 40px;
            width: 400px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3), 0 0 40px rgba(233, 69, 96, 0.2);
            position: relative;
            z-index: 10;
        }

        .main-panel {
            display: none;
            width: 90%;
            max-width: 1200px;
            height: 90vh;
            background: linear-gradient(145deg, rgba(26, 26, 46, 0.95), rgba(22, 33, 62, 0.95));
            border: 2px solid #00d4ff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }

        .vault-container {
            display: none;
            width: 90%;
            max-width: 1200px;
            height: 90vh;
            background: linear-gradient(145deg, rgba(26, 26, 46, 0.95), rgba(22, 33, 62, 0.95));
            border: 2px solid #00d4ff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }

        .device-panel {
            display: none;
            width: 90%;
            max-width: 1200px;
            height: 90vh;
            background: linear-gradient(145deg, rgba(26, 26, 46, 0.95), rgba(22, 33, 62, 0.95));
            border: 2px solid #00d4ff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }



        .login-title {
            font-size: 24px;
            margin-bottom: 10px;
            color: #e94560;
            text-shadow: 0 0 10px #e94560;
        }

        .login-subtitle {
            font-size: 12px;
            color: #888;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #00d4ff;
        }

        .error-message {
            color: #ff0000;
            font-size: 12px;
            margin-top: 10px;
            display: none;
        }

        .vault-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #0f3460;
        }

        .vault-title {
            color: #00d4ff;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #00d4ff;
        }

        .logout-btn {
            background: linear-gradient(145deg, #2a2a3e, #1e1e32);
            border: 1px solid #0f3460;
            border-radius: 4px;
            color: #e94560;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 8px 16px;
            transition: all 0.2s ease;
            text-shadow: 0 0 4px #e94560;
            font-family: 'Courier New', monospace;
        }

        .logout-btn:hover {
            background: linear-gradient(145deg, #3a3a4e, #2e2e42);
            border-color: #e94560;
            box-shadow: 0 0 8px rgba(233, 69, 96, 0.4);
        }

        .vault-content {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
            height: calc(100% - 80px);
        }

        .sidebar {
            background: linear-gradient(145deg, #2a2a3e, #1e1e32);
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 20px;
        }

        .main-content {
            background: linear-gradient(145deg, #2a2a3e, #1e1e32);
            border: 1px solid #0f3460;
            border-radius: 8px;
            padding: 20px;
            overflow-y: auto;
        }

        .input-field {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00d4ff;
            color: #00d4ff;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border-radius: 4px;
        }

        .input-field:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: rgba(0, 212, 255, 0.1);
            border: 2px solid #00d4ff;
            color: #00d4ff;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px;
        }

        .login-btn:hover {
            background: rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
        }

        .category-btn {
            padding: 15px;
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border: 1px solid #0f3460;
            border-radius: 8px;
            color: #00d4ff;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            text-align: center;
        }

        .category-btn:hover, .category-btn.active {
            background: linear-gradient(145deg, #3a3a4e, #2e2e42);
            border-color: #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.4);
        }

        .add-btn {
            background: linear-gradient(145deg, #2a4a2e, #1e3e22);
            border: 2px solid #00ff41;
            border-radius: 8px;
            color: #00ff41;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 15px;
            transition: all 0.2s ease;
            text-shadow: 0 0 4px #00ff41;
            font-family: 'Courier New', monospace;
        }

        .add-btn:hover {
            background: linear-gradient(145deg, #3a5a3e, #2e4e32);
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.4);
        }

        .item-card {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border: 1px solid #0f3460;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.2s ease;
        }

        .item-card:hover {
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .item-title {
            color: #e94560;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .item-content {
            color: #ccc;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .item-meta {
            font-size: 11px;
            color: #666;
            margin-bottom: 15px;
        }

        .item-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .action-btn {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid #0f3460;
            border-radius: 6px;
            color: #00d4ff;
            cursor: pointer;
            font-size: 12px;
            padding: 10px 15px;
            transition: all 0.2s ease;
            font-family: 'Courier New', monospace;
        }

        .action-btn:hover {
            background: rgba(0, 212, 255, 0.2);
            border-color: #00d4ff;
        }

        .delete-btn {
            background: rgba(233, 69, 96, 0.1);
            border-color: #e94560;
            color: #e94560;
        }

        .delete-btn:hover {
            background: rgba(233, 69, 96, 0.2);
        }

        .error-message {
            color: #ff0000;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }

        .tablet-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .nav-btn {
            background: linear-gradient(145deg, #2a2a3e, #1e1e32);
            border: 1px solid #0f3460;
            border-radius: 6px;
            color: #00d4ff;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            padding: 12px 20px;
            transition: all 0.2s ease;
            text-shadow: 0 0 4px #00d4ff;
            font-family: 'Courier New', monospace;
        }

        .nav-btn:hover {
            background: linear-gradient(145deg, #3a3a4e, #2e2e42);
            border-color: #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.4);
        }

        .logout-btn {
            color: #e94560;
            border-color: #e94560;
            text-shadow: 0 0 4px #e94560;
        }

        .logout-btn:hover {
            border-color: #e94560;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.4);
        }

        .empty-state {
            text-align: center;
            color: #888;
            margin-top: 100px;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .empty-text {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .empty-subtext {
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    
    <!-- Login Screen -->
    <div class="tablet-login" id="tabletLogin">
        <div class="login-card">
            <div class="login-title">VAULT PRO</div>
            <div class="login-subtitle">TABLET INTERFACE - SECURE DATA STORAGE</div>
            
            <div class="input-group">
                <label class="input-label">SECURITY CLEARANCE</label>
                <input type="password" class="input-field" id="tabletPassword" placeholder="Enter access code...">
            </div>
            
            <button class="login-btn" onclick="tabletAuthenticate()">AUTHENTICATE</button>
            <div class="error-message" id="tabletError">ACCESS DENIED - INVALID CREDENTIALS</div>
        </div>
    </div>

    <!-- Main Interface -->
    <div class="tablet-container" id="tabletContainer" style="display: none;">
        <div class="tablet-header">
            <div class="tablet-title">VAULT PRO - TABLET INTERFACE</div>
            <div class="tablet-subtitle">SECURE DATA STORAGE SYSTEM</div>
        </div>
        
        <div class="tablet-content">
            <div class="tablet-sidebar">
                <button class="add-btn" onclick="showAddForm()">+ ADD NEW ITEM</button>
                <button class="category-btn active" data-category="all">ALL ITEMS</button>
                <button class="category-btn" data-category="documents">DOCUMENTS</button>
                <button class="category-btn" data-category="passwords">PASSWORDS</button>
                <button class="category-btn" data-category="notes">SECRET NOTES</button>
                
                <div style="margin-top: auto;">
                    <button class="nav-btn logout-btn" onclick="tabletLogout()">LOGOUT</button>
                </div>
            </div>
            
            <div class="tablet-main">
                <div class="tablet-nav">
                    <div style="color: #00d4ff; font-size: 16px; font-weight: bold;" id="categoryTitle">ALL ITEMS</div>
                    <div style="color: #888; font-size: 12px;" id="itemCount">0 items</div>
                </div>
                
                <div id="tabletItemsList">
                    <div class="empty-state">
                        <div class="empty-icon">🔒</div>
                        <div class="empty-text">No items found</div>
                        <div class="empty-subtext">Click "ADD NEW ITEM" to get started</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="vault.js?v=2.0.1"></script>
</body>
</html>
